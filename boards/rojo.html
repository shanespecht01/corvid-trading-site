<!-- ================================================================
     TEMPLATE FOR NEW CLIENT BOARDS
     This file is the reusable idea-board template — everything on the
     page is rendered by board.js from the data file loaded below.
     To add a new client:
       1. Copy this file to boards/<slug>.html.
       2. Change the <script src="rojo.data.js"> line below to point
          at a new boards/<slug>.data.js (copy rojo.data.js as a
          starting shape — see README.md "Client idea boards").
       3. Set that client's boardPath in js/welcome-clients.json to
          boards/<slug>.html so the welcome banner links to it.
     Nothing else in this file needs to change.
     ================================================================ -->
<div id="board-root"></div>
<script src="../js/edit-mode.js"></script>
<script src="rojo.data.js"></script>
<script src="board.js"></script>
</body>
</html>
